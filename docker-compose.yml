services:
  postgres:
    image: postgres:16-alpine
    container_name: aula-docente-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aula_docente
      POSTGRES_USER: aula_user
      POSTGRES_PASSWORD: aula_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula_user -d aula_docente"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
