services:
  postgres:
    image: postgres:16-alpine
    container_name: aula-docente-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aula_docente
      POSTGRES_USER: aula_user
      POSTGRES_PASSWORD: aula_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./database/002_seed_reference_data.sql:/docker-entrypoint-initdb.d/002_seed_reference_data.sql
      - ./database/003_integrity_triggers.sql:/docker-entrypoint-initdb.d/003_integrity_triggers.sql
      - ./database/004_partials.sql:/docker-entrypoint-initdb.d/004_partials.sql
      - ./database/005_google_sheets.sql:/docker-entrypoint-initdb.d/005_google_sheets.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula_user -d aula_docente"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
